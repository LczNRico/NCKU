        <h1>4.7 體缺陷</h1>
        
        <p class="indent">在所有固體材料中還存在其他比前面討論過的缺陷大得多的缺陷。這些缺陷包括孔洞、裂紋、異物夾雜以及其他相。它們通常是在加工和製造步驟中引入的。這些缺陷中的一些及其對材料性質的影響將在後續章節中討論。</p>
