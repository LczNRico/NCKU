    <h1><span class="section-number">2.9</span> 分子</h1>
    
    <p>許多常見的分子是由強共價鍵結合在一起的原子團所組成，包括<span class="term">元素雙原子分子</span>（F<sub>2</sub>、O<sub>2</sub>、H<sub>2</sub>等），以及大量的化合物（H<sub>2</sub>O、CO<sub>2</sub>、HNO<sub>3</sub>、C<sub>6</sub>H<sub>6</sub>、CH<sub>4</sub>等）。在凝聚態液體和固體狀態中，分子之間的鍵結是較弱的次級鍵結。因此，分子材料具有相對低的熔點和沸點溫度。大多數由少數原子組成的小分子材料，在常溫或環境溫度和壓力下是氣體。然而，許多現代聚合物作為分子材料，由極大的分子所組成，以固體形式存在；它們的某些性質強烈依賴於凡得瓦和氫次級鍵結的存在。</p>
