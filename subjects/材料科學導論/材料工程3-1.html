    <h1><span class="section-number">3.1</span> 緒論</h1>
    
    <div class="intro-section">
        <p class="no-indent">第2章主要關注各種類型的原子鍵結，這些鍵結是由個別原子的電子結構所決定的。本討論將深入探討材料結構的下一個層次，特別是原子在固態中可能採取的一些排列方式。在此架構內，引入了<span class="term">結晶性</span>和<span class="term">非結晶性</span>的概念。對於結晶固體，<span class="term">晶體結構</span>的概念以<span class="term">單位晶胞</span>的形式呈現。接著詳細介紹金屬中發現的三種常見晶體結構，以及表達<span class="term">晶體學點</span>、<span class="term">方向</span>和<span class="term">平面</span>的方案。還考慮了<span class="term">單晶</span>、<span class="term">多晶材料</span>和<span class="term">非晶材料</span>。本章的另一節簡要描述了如何使用<span class="term">X射線繞射技術</span>實驗性地確定晶體結構。</p>
